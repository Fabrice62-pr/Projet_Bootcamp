{% extends 'frontend/auth/base_auth.html' %}
{% block title %}Mot de passe modifié{% endblock %}

  <h2 class="card-title">Mot de passe modifié</h2>
  <p class="card-sub mb-3">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>

<a class="btn-login d-block text-center text-decoration-none" href="{% url 'frontend:login' %}">

</a>
{% endblock %}
