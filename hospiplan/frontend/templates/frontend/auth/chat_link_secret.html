<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmer la connexion — HospiPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
  <main class="container" style="max-width: 30rem;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-shield-lock text-primary" style="font-size: 2.2rem;"></i>
          <h1 class="h5 mt-2 mb-1">Confirmer la connexion</h1>
          <p class="text-body-secondary small mb-0">
            Connecté en tant que <strong>{{ user.get_username }}</strong>.
            Saisissez le secret de vérification pour rattacher la conversation
            à votre compte.
          </p>
        </div>

        {% if error %}
          <div class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
          </div>
        {% endif %}

        <form method="post" action="{% url 'frontend:chat_link_confirm' %}" novalidate>
          {% csrf_token %}
          <input type="hidden" name="token" value="{{ token }}">
          <input type="hidden" name="projectId" value="{{ project_id }}">

          <div class="mb-3">
            <label for="secret" class="form-label">Secret de vérification</label>
            <input type="password" class="form-control" id="secret" name="secret"
                   autocomplete="off" autofocus required>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check2 me-1"></i> Confirmer
          </button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
