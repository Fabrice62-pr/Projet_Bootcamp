<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if ok %}Conversation authentifiée{% else %}Connexion impossible{% endif %} — HospiPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-secondary">
  <main class="container" style="max-width: 34rem;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4 text-center">
        {% if ok %}
          <i class="bi bi-check-circle-fill text-success" style="font-size: 2.5rem;"></i>
          <h1 class="h5 mt-3">Conversation authentifiée</h1>
        {% else %}
          <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
          <h1 class="h5 mt-3">Connexion impossible</h1>
        {% endif %}
        <p class="text-body-secondary mb-4">{{ message }}</p>
        <a href="{% url 'frontend:dashboard' %}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-house me-1"></i> Aller au tableau de bord
        </a>
      </div>
    </div>
  </main>
</body>
</html>
